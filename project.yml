name: SmartLLMRouter
options:
  bundleIdPrefix: com.smartllmrouter
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: 5.9
    # Signing: identity determined at build time (match/gym for release, ad-hoc for CI)
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_CODE_SIGNING: YES

targets:
  SmartLLMRouter:
    type: application
    platform: macOS
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleDisplayName: "SmartLLMRouter"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSHumanReadableCopyright: "SmartLLMRouter"
        SUEnableChannel: true
        SUFeedURL: "https://smartllmrouter.github.io/appcast.xml"
        SUPublicEDKey: "N9VmllR+tHZrPVcLnuTP3Zp2CPFQ8ULyZHGr/sfYzNY="
    scheme:
      testTargets:
        - SmartLLMRouterTests
        - SmartLLMRouterUITests
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_MODULE_NAME: SmartLLMRouter
        PRODUCT_NAME: SmartLLMRouter
        PRODUCT_BUNDLE_IDENTIFIER: com.smartllmrouter.app
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTABILITY: YES
        # Signing identity set at build time by match/gym or xcargs
        CODE_SIGN_ENTITLEMENTS: Resources/SmartLLMRouter.entitlements
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 1
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          "CODE_SIGN_IDENTITY[sdk=macosx*]": Developer ID Application
          DEVELOPMENT_TEAM: G2DGKXFDHZ
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp
          ENABLE_TESTABILITY: NO
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEAD_CODE_STRIPPING: YES
          STRIP_INSTALLED_PRODUCT: YES
          COPY_PHASE_STRIP: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          ASSETCATALOG_COMPILER_OPTIMIZATION: space
    dependencies:
      - sdk: Cocoa.framework
      - sdk: SystemConfiguration.framework
      - sdk: libsqlite3.tbd
    preBuildScripts:
      - name: SwiftLint
        script: |
          if [ -f "${PODS_ROOT}/SwiftLint/swiftlint" ]; then
            "${PODS_ROOT}/SwiftLint/swiftlint" --config "${SRCROOT}/.swiftlint.yml" || echo "warning: SwiftLint found issues"
          else
            echo "warning: SwiftLint not found in Pods"
          fi
        basedir: "${SRCROOT}"
    postBuildScripts:
      - name: Sign Sparkle Framework
        script: |
          sparkle_framework="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/Sparkle.framework"
          if [ "${CONFIGURATION}" = "Release" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ -d "${sparkle_framework}" ]; then
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --options runtime --timestamp "${sparkle_framework}"
          fi
        basedir: "${SRCROOT}"

  SmartLLMRouterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Unit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartllmrouter.tests
        PRODUCT_MODULE_NAME: SmartLLMRouterTests
        GENERATE_INFOPLIST_FILE: YES
        ONLY_ACTIVE_ARCH: YES
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        PRODUCT_NAME: SmartLLMRouterTests
        ENABLE_TESTABILITY: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SmartLLMRouter.app/Contents/MacOS/SmartLLMRouter"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SmartLLMRouter

  SmartLLMRouterUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartllmrouter.ui-tests
        PRODUCT_MODULE_NAME: SmartLLMRouterUITests
        GENERATE_INFOPLIST_FILE: YES
        ONLY_ACTIVE_ARCH: YES
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        PRODUCT_NAME: SmartLLMRouterUITests
    dependencies:
      - target: SmartLLMRouter
