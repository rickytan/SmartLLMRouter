name: SmartLLMRouter
options:
  bundleIdPrefix: com.smartllmrouter
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Swifter:
    url: https://github.com/httpswift/swifter.git
    majorVersion: 1.5.0
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    majorVersion: 5.9.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    majorVersion: 4.2.2

settings:
  base:
    SWIFT_VERSION: 5.9
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_CFBundleDisplayName: "SmartLLMRouter"
    INFOPLIST_KEY_NSHumanReadableCopyright: "SmartLLMRouter"

targets:
  SmartLLMRouter:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_MODULE_NAME: SmartLLMRouter
        PRODUCT_NAME: SmartLLMRouter
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      debug:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - sdk: Cocoa.framework
      - sdk: SystemConfiguration.framework
      - package: Swifter
      - package: Alamofire
      - package: KeychainAccess
