name: SmartLLMRouter
options:
  bundleIdPrefix: com.smartllmrouter
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: 5.9
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_CFBundleDisplayName: "SmartLLMRouter"
    INFOPLIST_KEY_NSHumanReadableCopyright: "SmartLLMRouter"
    # Sparkle auto-update feed URL
    SUFeedURL: "https://smartllmrouter.github.io/appcast.xml"
    SUPublicEDKey: "1nIh5ueJSj1TV+vOrR27J6eBKmPyUssmNvPcTG9/Eko="
    # Signing: identity determined at build time (match/gym for release, ad-hoc for CI)
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_CODE_SIGNING: YES

targets:
  SmartLLMRouter:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - SmartLLMRouterTests
        - SmartLLMRouterUITests
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_MODULE_NAME: SmartLLMRouter
        PRODUCT_NAME: SmartLLMRouter
        PRODUCT_BUNDLE_IDENTIFIER: com.smartllmrouter.app
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTABILITY: YES
        # Signing identity set at build time by match/gym or xcargs
        CODE_SIGN_ENTITLEMENTS: Resources/SmartLLMRouter.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          "CODE_SIGN_IDENTITY[sdk=macosx*]": Developer ID Application
          DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - sdk: Cocoa.framework
      - sdk: SystemConfiguration.framework
      - sdk: libsqlite3.tbd
    preBuildScripts:
      - name: SwiftLint
        script: |
          if [ -f "${PODS_ROOT}/SwiftLint/swiftlint" ]; then
            "${PODS_ROOT}/SwiftLint/swiftlint" --config "${SRCROOT}/.swiftlint.yml" || echo "warning: SwiftLint found issues"
          else
            echo "warning: SwiftLint not found in Pods"
          fi
        basedir: "${SRCROOT}"

  SmartLLMRouterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Unit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartllmrouter.tests
        PRODUCT_MODULE_NAME: SmartLLMRouterTests
        GENERATE_INFOPLIST_FILE: YES
        ONLY_ACTIVE_ARCH: YES
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        PRODUCT_NAME: SmartLLMRouterTests
        ENABLE_TESTABILITY: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SmartLLMRouter.app/Contents/MacOS/SmartLLMRouter"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SmartLLMRouter

  SmartLLMRouterUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartllmrouter.ui-tests
        PRODUCT_MODULE_NAME: SmartLLMRouterUITests
        GENERATE_INFOPLIST_FILE: YES
        ONLY_ACTIVE_ARCH: YES
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        PRODUCT_NAME: SmartLLMRouterUITests
    dependencies:
      - target: SmartLLMRouter
