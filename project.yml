name: SmartLLMRouter
options:
  bundleIdPrefix: com.smartllmrouter
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_CFBundleDisplayName: "SmartLLMRouter"
    INFOPLIST_KEY_NSHumanReadableCopyright: "SmartLLMRouter"

targets:
  SmartLLMRouter:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - SmartLLMRouterTests
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_MODULE_NAME: SmartLLMRouter
        PRODUCT_NAME: SmartLLMRouter
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTING_SEARCH_PATHS: YES
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) COCOAPODS=1
      debug:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - sdk: Cocoa.framework
      - sdk: SystemConfiguration.framework
      - framework: Pods-SmartLLMRouter
    preBuildScripts:
      - name: SwiftLint
        script: |
          if [ -f "${PODS_ROOT}/SwiftLint/swiftlint" ]; then
            "${PODS_ROOT}/SwiftLint/swiftlint" --config "${SRCROOT}/.swiftlint.yml" || echo "warning: SwiftLint found issues"
          else
            echo "warning: SwiftLint not found in Pods"
          fi
        basedir: "${SRCROOT}"

  SmartLLMRouterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartllmrouter.tests
        PRODUCT_MODULE_NAME: SmartLLMRouterTests
        GENERATE_INFOPLIST_FILE: YES
        ONLY_ACTIVE_ARCH: YES
    dependencies:
      - target: SmartLLMRouter
