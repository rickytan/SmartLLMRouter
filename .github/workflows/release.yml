name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: SmartLLMRouter
  SCHEME: SmartLLMRouter
  BUILD_DIR: build

jobs:
  # ─────────────────────────────────────────────
  # CI: Build & Test (on every push/PR)
  # ─────────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: macos-14
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Install dependencies
        run: bundle exec pod install

      - name: Run SwiftGen
        run: |
          if command -v swiftgen &>/dev/null; then
            swiftgen config run
          else
            echo "warning: SwiftGen not installed, skipping"
          fi

      - name: Build
        run: |
          xcodebuild build \
            -workspace "${{ env.PROJECT_NAME }}.xcworkspace" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            CONFIGURATION_BUILD_DIR="${{ env.BUILD_DIR }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty --color

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -workspace "${{ env.PROJECT_NAME }}.xcworkspace" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            CONFIGURATION_BUILD_DIR="${{ env.BUILD_DIR }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

  # ─────────────────────────────────────────────
  # Release: Ad-hoc Sign, Package DMG, Publish
  # ─────────────────────────────────────────────
  release:
    name: Release
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/')
    needs: [] # Independent; can run without CI job

    env:
      APP_NAME: SmartLLMRouter.app
      OUTPUT_DIR: release-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      # ── Build ──
      - name: Generate project
        run: xcodegen generate

      - name: Install dependencies
        run: bundle exec pod install

      - name: Run SwiftGen
        run: |
          if command -v swiftgen &>/dev/null; then
            swiftgen config run
          else
            echo "warning: SwiftGen not installed, skipping"
          fi

      - name: Build Release (ad-hoc signed)
        run: |
          xcodebuild build \
            -workspace "${{ env.PROJECT_NAME }}.xcworkspace" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            CONFIGURATION_BUILD_DIR="${{ env.BUILD_DIR }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty --color

      - name: Verify ad-hoc signature
        run: |
          APP_PATH="${{ env.BUILD_DIR }}/${{ env.APP_NAME }}"
          codesign --verify --verbose "$APP_PATH"
          codesign -dvv "$APP_PATH" 2>&1 | head -20

      # ── Package DMG ──
      - name: Determine version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Strip leading "v" if present (v1.0.0-alpha -> 1.0.0-alpha)
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for tag=$TAG version=$VERSION"

      - name: Create DMG
        run: |
          mkdir -p "${{ env.OUTPUT_DIR }}"
          APP_PATH="${{ env.BUILD_DIR }}/${{ env.APP_NAME }}"
          DMG_NAME="SmartLLMRouter-${{ steps.version.outputs.version }}.dmg"
          DMG_PATH="${{ env.OUTPUT_DIR }}/$DMG_NAME"

          # Stage the .app + an Applications symlink in a temp folder
          STAGING_DIR="$(mktemp -d)/dmg-staging"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          # Build a compressed DMG (UDZO = zlib-compressed, standard for distribution)
          hdiutil create \
            -volname "SmartLLMRouter ${{ steps.version.outputs.version }}" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          # Ad-hoc sign the DMG too so codesign --verify passes on the container
          codesign --force --sign - "$DMG_PATH"
          codesign --verify --verbose "$DMG_PATH"

          ls -lh "${{ env.OUTPUT_DIR }}/"
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Copy dSYM (if present)
        run: |
          DSYM_PATH="${{ env.BUILD_DIR }}/${{ env.APP_NAME }}.dSYM"
          if [ -d "$DSYM_PATH" ]; then
            DSYM_ZIP="${{ env.OUTPUT_DIR }}/SmartLLMRouter-${{ steps.version.outputs.version }}.dSYM.zip"
            ditto -c -k --sequesterRsrc --keepParent "$DSYM_PATH" "$DSYM_ZIP"
            echo "Packaged dSYM at $DSYM_ZIP"
          else
            echo "No dSYM produced — skipping"
          fi

      # ── Deploy ──
      - name: Determine prerelease flag
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.OUTPUT_DIR }}/*.dmg
            ${{ env.OUTPUT_DIR }}/*.dSYM.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prerelease.outputs.value }}
          body: |
            ## SmartLLMRouter ${{ steps.version.outputs.version }}

            **Ad-hoc signed build.** First time opening on a new Mac, macOS Gatekeeper will block it.
            Right-click the app → **Open** → **Open** to bypass, or run:

            ```
            xattr -cr /Applications/SmartLLMRouter.app
            ```

            ### Install
            1. Download `SmartLLMRouter-${{ steps.version.outputs.version }}.dmg`
            2. Open the DMG and drag the app into **Applications**
            3. First launch: right-click → Open (Gatekeeper bypass)
