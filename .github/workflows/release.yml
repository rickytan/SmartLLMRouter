name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # required by softprops/action-gh-release

env:
  PROJECT_NAME: SmartLLMRouter
  SCHEME: SmartLLMRouter
  BUILD_DIR: build

jobs:
  # ─────────────────────────────────────────────
  # Path filter: detect code vs docs-only changes
  # ─────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'Sources/**'
              - 'Tests/**'
              - 'Resources/**'
              - 'Pods/**'
              - 'project.yml'
              - 'Podfile'
              - 'Podfile.lock'
              - 'Gemfile'
              - 'Gemfile.lock'
              - 'swiftgen.yml'
              - '.github/workflows/**'
              - 'fastlane/**'
              - 'scripts/**'
              - '**/*.swift'
              - '**/*.entitlements'
              - '**/*.xcassets/**'

  # ─────────────────────────────────────────────
  # CI: Xcode build + unit tests
  # ─────────────────────────────────────────────
  build-test:
    name: Xcode Build & Test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Install dependencies
        run: bundle exec pod install

      - name: Run SwiftGen
        run: |
          if command -v swiftgen &>/dev/null; then
            swiftgen config run
          else
            echo "warning: SwiftGen not installed, skipping"
          fi

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "${{ env.PROJECT_NAME }}.xcworkspace" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty --color

      - name: Run Unit Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace "${{ env.PROJECT_NAME }}.xcworkspace" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -only-testing:SmartLLMRouterTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

  # ─────────────────────────────────────────────
  # Umbrella job: satisfies branch protection
  # ─────────────────────────────────────────────
  ci:
    name: Build & Test
    needs: [changes, build-test]
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          BUILD_RESULT="${{ needs.build-test.result }}"
          if [[ "$BUILD_RESULT" == "success" || "$BUILD_RESULT" == "skipped" ]]; then
            if [[ "$BUILD_RESULT" == "skipped" ]]; then
              echo "✅ Docs-only change — skipping Xcode build."
            else
              echo "✅ Build & tests passed."
            fi
            exit 0
          fi
          echo "::error::Xcode Build & Test job concluded with: $BUILD_RESULT"
          exit 1

  # ─────────────────────────────────────────────
  # Release: fastlane build → sign → dmg → notarize → release
  # ─────────────────────────────────────────────
  release:
    name: Release
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/')
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup Ruby (bundler)
        run: bundle install

      # ── Import Developer ID certificate ──
      - name: Setup signing keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash scripts/setup-keychain.sh

      # ── fastlane release pipeline ──
      - name: Build, Sign, DMG, Notarize
        env:
          CODE_SIGN_IDENTITY: ${{ vars.CODE_SIGN_IDENTITY_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bundle exec fastlane release

      # ── Determine version for release naming ──
      - name: Determine version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine prerelease flag
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      # ── GitHub Release ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.dSYM.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prerelease.outputs.value }}

      # ── Deploy Appcast to GitHub Pages (stable releases only) ──
      - name: Deploy Appcast to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: release-artifacts
          keep_files: false
          force_orphan: true
        if: ${{ steps.prerelease.outputs.value == 'false' }}
