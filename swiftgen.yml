# SwiftGen Configuration
# Generates type-safe code for localized strings and assets

strings:
  inputs: Resources/en.lproj/Localizable.strings
  outputs:
    templatePath: swiftgen/templates/l10n-compat.stencil
    output: Sources/Generated/L10n.swift

xcassets:
  inputs: Resources/Assets.xcassets
  outputs:
    templateName: swift5
    output: Sources/Generated/Assets+Generated.swift
