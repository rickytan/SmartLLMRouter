# SwiftLint Configuration
# https://github.com/realm/SwiftLint

disabled_rules:
  - trailing_whitespace
  - todo
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - type_name

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_string
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - prohibited_super_call
  - vertical_parameter_alignment_on_call

included:
  - Sources

excluded:
  - Sources/Generated
  - Pods
  - .build

identifier_name:
  min_length: 1
  max_length:
    warning: 40
    error: 50

line_length:
  warning: 200
  error: 300

reporter: "xcode"
