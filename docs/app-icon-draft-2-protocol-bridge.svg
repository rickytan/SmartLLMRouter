<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="900" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#102033"/>
      <stop offset="0.58" stop-color="#0D1726"/>
      <stop offset="1" stop-color="#080D16"/>
    </linearGradient>
    <linearGradient id="cyan" x1="220" y1="268" x2="804" y2="756" gradientUnits="userSpaceOnUse">
